ion:absolute;z-index:5;bottom:11%;left:1.1%;background:#021729dc;border:1px solid #3685b0;border-radius:7px;padding:6px 9px;color:#d8f6ff;font-size:11px}.floor-msg{position:absolute;z-index:5;bottom:11%;right:1.3%;background:#08263fe8;border:1px solid #50b4df;border-radius:7px;padding:8px 11px;color:var(--gold);max-width:37%;font-size:11px}.process-overlay{position:absolute;z-index:4;inset:0;pointer-events:none}.money-pile{position:absolute;transform:translate(-50%,-50%);background:#032640eb;border:1px solid #35d2ef;padding:5px 8px;border-radius:8px;color:#ffde6a;text-align:center;box-shadow:0 3px 9px #0018;min-width:78px;font-size:11px;font-weight:800}.money-pile i{font-style:normal;display:block;font-size:17px;letter-spacing:-5px;margin-right:5px}.money-pile small{display:block;font-size:9px;color:#e7f8ff}.finance-board{position:absolute;z-index:5;left:0;right:0;bottom:0;top:58%;background:linear-gradient(120deg,#061833f8,#0e3045f8);border-top:3px solid #31b6d8;padding:1.1% 2%;display:flex;flex-direction:column;gap:8px}.finance-board h3{margin:0;font-size:13px;color:#63ecfc;letter-spacing:1px}.finance-tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;flex:1}.finance-tiles .tile{min-width:0;background:#092943;border:1px solid #2979a7;border-radius:6px;padding:5px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center}.finance-tiles .tile b{font-size:16px;color:#f8d65c}.finance-tiles .tile small{color:#c4edfb;font-size:9px}.finance-tiles .tile center{font-size:17px}.finance-tiles .tile.cashbox{background:#145542;border-color:#28dd9a}.finance-tiles .tile.cashbox b{color:#8affae}.flow-caption{position:absolute;z-index:4;left:3%;right:3%;bottom:10%;background:#041831ed;border:1px solid #40aecc;padding:10px;border-radius:8px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}.flow-caption .val{font-size:17px;color:var(--gold);font-weight:800}.side{background:linear-gradient(#0c2543,#061729);b in:8px 0;border-radius:6px;font-size:12px}.successmsg{background:#073e33;border:1px solid #23c587;color:#c9ffed;padding:8px;margin:8px 0;border-radius:6px;font-size:12px}.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.catalog-item{background:#0c3050;border:1px solid #36779e;border-radius:7px;padding:7px;text-align:center}.catalog-item img{width:100%;height:85px;object-fit:contain}.catalog-item .price{color:#ffd866;font-weight:800;font-size:11px}.nav{position:sticky;bottom:0;z-index:14;background:#031025;display:flex;padding:6px;gap:4px;border-top:2px solid #2d86c3;overflow-x:auto}.nav button{flex:1;min-width:87px;background:linear-gradient(#092b50,#04162e);border:1px solid #1f78bb;color:#89d8fa;font-size:11px;font-weight:800;padding:10px 3px;border-radius:4px;white-space:nowrap}.nav button.active{background:linear-gradient(#056bb9,#084276);color:#fff;box-shadow:inset 0 0 0 1px #5ce2ff}.nav button span{display:block;font-size:20px}.phasebar{background:#06203a;border-bottom:1px solid #256da0;display:flex;align-items:center;gap:8px;padding:7px 12px;flex-wrap:wrap}.phasebar .tag{border:1px solid #326c95;border-radius:4px;padding:4px 8px;font-weight:800;font-size:11px}.phasebar .tag.active{background:#0f6d9d;color:white}.phasebar .tag.done{color:#2ff5ad}.phasebar .grow{flex:1}.phasebar button{padding:7px 14px}.popup-screen{position:absolute;z-index:10;inset:9% 2% 10%;background:#061c34f4;border:2px solid #3ba5e0;border-radius:11px;box-shadow:0 10px 36px #000c;overflow:auto;padding:14px}.popup-screen.white{background:rgba(255,255,255,.93);border-color:#d8dde6;color:#10243b}.popup-screen.white h2,.popup-screen.white h3{color:#0d2f59}.popup-screen.white .box{background:rgba(255,255,255,.64);border-color:#ccd7e5}.popup-screen.white .warning{background:#fff2c7;border-color:#e9c54a;color:#6d5200}.popup-screen.white .statline{border-bottom-color:#dde8f4}.popup-screen.white .text-muted,.popup-screen.white p,.popup-screen.white small,.popup-screen.white td,.popup-screen.white th{color:#243c52}.popup-screen.white table th{background:#e9f4ff;color:#0d2f59}.popup-screen.white .badge{background:#dfeaf8;color:#16446b}.popup-screen h2{margin:0 0 10px;color:#5ae7ff}.popup-screen table{border-collapse:collapse;width:100%;font-size:12px}.popup-screen th,.popup-screen td{padding:6px 8px;border-bottom:1px solid #234f74;text-align:left}.popup-screen th{background:#0b3355;color:#8ed8f9}.popup-screen .mini{font-size:10px;color:#b3cedb}.popup-screen .smallbtn{padding:5px 7px}.scroll{overflow:auto}.pillbar{display:flex;gap:4px;flex-wrap:wrap}.pillbar span{background:#0c3457;border:1px solid #245d89;border-radius:4px;padding:3px 6px;font-size:10px}.quote{border-left:3px solid #fbc34d;padding-left:8px;color:#d5f3ff}.spark{animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.55}}@media(max-width:1090px){.header{grid-template-columns:repeat(4,minmax(0,1fr))}.brand{grid-column:span 2}.main{grid-template-columns:minmax(0,1fr) 290px}.hud{min-height:52px}.hud b{font-size:14px}}@media(max-width:760px){.main{grid-template-columns:1fr}.side{border-left:0;max-height:none}.header{grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:4px}.brand{grid-column:span 2}.brand strong{font-size:15px}.hud{min-height:40px;padding:5px}.hud label{font-size:9px}.hud b{font-size:12px}.viewport{min-height:auto}.nav button{min-width:76px}.scene-top{font-size:9px;padding:3px}.floor-machine .machine-tag{font-size:8px}.money-pile{padding:3px;font-size:8px;min-width:55px}.money-pile i{font-size:12px}.flow-caption{font-size:9px}}

<script>
'use strict';
(()=>{
const mount=document.getElementById('screen');
const MACH={S:{name:'Small',cost:2400000,slots:1,staff:1,elec:45000,conv:1100,repair:140000,pm:30000,rates:{P1:100,P2:80,P4:60}},M:{name:'Medium',cost:5800000,slots:1,staff:2,elec:95000,conv:900,repair:300000,pm:65000,auto:950000,rates:{P3:90,P5:60}},L:{name:'Large',cost:10500000,slots:2,staff:2,elec:185000,conv:760,repair:550000,pm:100000,auto:1350000,rates:{P1:150,P2:130,P3:120,P4:110,P5:100}}};
const PROD={P1:{price:18000,raw:14000,color:'#30b765'},P2:{price:19500,raw:15100,color:'#ffd04b'},P3:{price:24000,raw:18700,color:'#ff6b83'},P4:{price:22500,raw:17100,color:'#47bcff'},P5:{price:29000,raw:22400,color:'#b980fc'}};
const RAW_C=[['C1','P1',100,'now',0,1],['C2','P2',80,'now',0,1],['C3','P1',200,'next',0,1],['C4','P2',160,'next',0,1],['C5','P1',200,'next',60,1],['C6','P2',240,'split',60,1],['C7','P1',300,'next',60,1],['C8','P2',320,'split',60,1],['C9','P3',180,'next',70,1],['C10','P3',270,'split',70,1],['C11','P4',120,'split',75,1],['C12','P4',240,'next',75,1],['C13','P1',300,'next',60,3],['C14','P2',160,'now',60,3],['C15','P3',180,'split',70,5],['C16','P1',300,'next',60,5],['C17','P4',120,'next',75,8],['C18','P5',120,'split',75,8],['C19','P1',200,'next',65,10],['C20','P2',240,'split',65,10]];
const ORDER_PATTERN=[0,0,1,1,2,2,3,2,4,4,5,4];

// Economic event draw: exactly one shared macro environment per auction round (300 tickets).
const EVENTS=[{"id":"E00","name":"ภาวะปกติ ไม่มีเหตุการณ์","severity":"none","weight":100,"probability_exact":"100/300","effect":"ไม่มีการเปลี่ยนแปลง"},{"id":"E01","name":"ผลผลิตข้าวโพดออกสู่ตลาดมาก","severity":"mild","weight":16,"probability_exact":"16/300","effect":"วัตถุดิบ P1/P2/P4 −2%"},{"id":"E02","name":"การแข่งขันขนส่งช่วยลดต้นทุน","severity":"mild","weight":15,"probability_exact":"15/300","effect":"ค่าขนส่ง −10%"},{"id":"E03","name":"กากถั่วเหลืองนำเข้ามีราคาลดลง","severity":"mild","weight":15,"probability_exact":"15/300","effect":"วัตถุดิบ P3/P5 −3%"},{"id":"E04","name":"ต้นทุนดีเซลเพิ่ม","severity":"mild","weight":14,"probability_exact":"14/300","effect":"ค่าขนส่ง +10%"},{"id":"E05","name":"ค่า Ft ปรับลด","severity":"mild","weight":14,"probability_exact":"14/300","effect":"ค่าไฟคงที่และ Automation −5%"},{"id":"E06","name":"ต้นทุนการตรวจสอบย้อนกลับวัตถุดิบ","severity":"mild","weight":13,"probability_exact":"13/300","effect":"ค่าปฏิบัติตามข้อกำหนด 35,000 บาท หากผลิต"},{"id":"E07","name":"บรรจุภัณฑ์และวัสดุสิ้นเปลืองขึ้นราคา","severity":"mild","weight":13,"probability_exact":"13/300","effect":"ต้นทุนแปรรูป +2%"},{"id":"E08","name":"กากถั่วเหลืองตึงตัว","severity":"moderate","weight":12,"probability_exact":"12/300","effect":"วัตถุดิบ P3/P5 +4%"},{"id":"E09","name":"ผลผลิตข้าวโพดลดลง","severity":"moderate","weight":12,"probability_exact":"12/300","effect":"วัตถุดิบ P1/P2/P4 +5%"},{"id":"E10","name":"ค่าไฟอุตสาหกรรมเพิ่ม","severity":"moderate","weight":11,"probability_exact":"11/300","effect":"ค่าไฟคงที่และ Automation +12%"},{"id":"E11","name":"การขนส่งล่าช้าและต้นทุนสูง","severity":"moderate","weight":10,"probability_exact":"10/300","effect":"ค่าขนส่ง +35%"},{"id":"E12","name":"ลูกค้า SME ชะลอชำระเงิน","severity":"moderate","weight":10,"probability_exact":"10/300","effect":"เลื่อนลูกหนี้ 1 รายการ +1 รอบ"},{"id":"E13","name":"ต้นทุนเงินทุนเข้มงวด","severity":"moderate","weight":9,"probability_exact":"9/300","effect":"ดอกเบี้ยเงินกู้ +0.5 จุดเปอร์เซ็นต์/รอบ ในรอบถัดไป"},{"id":"E14","name":"กำลังซื้อเกษตรกรเปราะบาง","severity":"moderate","weight":9,"probability_exact":"9/300","effect":"เลื่อน 50% ของลูกหนี้หนึ่งรายการ +2 รอบ"},{"id":"E15","name":"ต้นทุนเอกสารนำเข้าวัตถุดิบเพิ่ม","severity":"severe","weight":8,"probability_exact":"8/300","effect":"วัตถุดิบทุกสินค้า +2% และค่าปฏิบัติตามข้อกำหนด 75,000 บาทเมื่อผลิต"},{"id":"E16","name":"ภัยแล้งกระทบพืชอาหารสัตว์","severity":"severe","weight":7,"probability_exact":"7/300","effect":"วัตถุดิบทุกสินค้า +8%"},{"id":"E17","name":"ไฟฟ้าขัดข้องกระทบเครื่องจักร","severity":"severe","weight":6,"probability_exact":"6/300","effect":"เครื่องจักรที่ไม่ได้ทำ PM รอบก่อน 1 เครื่อง/บริษัท เสีย 2 Blocks จนซ่อม"},{"id":"E18","name":"ลูกค้าประสบปัญหาหนี้เสีย","severity":"severe","weight":4,"probability_exact":"4/300","effect":"ตัดหนี้สูญ 30% ของลูกหนี้หนึ่งรายการ ที่เหลือเลื่อน +1 รอบ"},{"id":"E19","name":"วิกฤตต้นทุนพลังงานและวัตถุดิบ","severity":"severe","weight":2,"probability_exact":"2/300","effect":"วัตถุดิบทุกสินค้า +12% ค่าไฟ +20% และค่าขนส่ง +35%"}];
function pickEvent(){let r=Math.floor(Math.random()*300);for(const e of EVENTS){r-=e.weight;if(r<0)return e;}return EVENTS[0];}
function eventNow(){return EVENTS.find(e=>e.id===(g.activeEvent?.id||'E00'))||EVENTS[0];}
function isEvent(id){return eventNow().id===id&&g.activeEvent?.q===g.q;}
function currentInterest(){return .03+(g.rateAdd?.[g.q]||0);}
function rawMod(p){let e=eventNow().id;if(g.activeEvent?.q!==g.q)return 0;
 if(e==='E01'&&['P1','P2','P4'].includes(p))return -.02;
 if(e==='E03'&&['P3','P5'].includes(p))return -.03;
 if(e==='E08'&&['P3','P5'].includes(p))return .04;
 if(e==='E09'&&['P1','P2','P4'].includes(p))return .05;
 if(e==='E15')return .02;
 if(e==='E16')return .08;
 if(e==='E19')return .12;
 return 0;}
function rawPrice(p){return Math.round((PROD[p]?.raw||0)*(1+rawMod(p)));}
function conversionFactor(){return isEvent('E07')?1.02:1;}
function energyFactor(){return isEvent('E05')?.95:isEvent('E10')?1.12:isEvent('E19')?1.20:1;}
function freightFactor(){return isEvent('E02')?.90:isEvent('E04')?1.10:isEvent('E11')?1.35:isEvent('E19')?1.35:1;}
function deferReceipt(t,portion,quarters,writeoff=0){let x=t.receipts.filter(r=>r.amount>0).sort((a,b)=>a.due-b.due)[0];
 if(!x){record(t,'economic-event','ไม่มีลูกหนี้เข้าข่ายการเลื่อนชำระในรอบนี้');return;}
 const original=x.amount,bad=Math.round(original*writeoff),moved=Math.round(original*portion);
 if(bad){t.ar-=bad;t.retained-=bad;t.pnl.opex+=bad;record(t,'bad-debt','หนี้สูญจากความเสี่ยงลูกค้า',bad);}
 const deferred=Math.max(0,moved-bad);
 x.amount=original-moved;
 if(x.amount===0)t.receipts=t.receipts.filter(r=>r!==x);
 if(deferred)t.receipts.push({due:x.due+quarters,amount:deferred});
 record(t,'economic-event','ลูกหนี้ '+THB(deferred)+' เลื่อนรับจาก Q'+x.due+' เป็น Q'+(x.due+quarters));
}
function impactEvent(t){const id=eventNow().id;record(t,'economic-event','Q'+g.q+' · '+eventNow().name+' — '+eventNow().effect);
 if(id==='E12')deferReceipt(t,1,1);
 if(id==='E14')deferReceipt(t,.5,2);
 if(id==='E18')deferReceipt(t,1,1,.30);
 if(id==='E17'){

function breakEvenEstimate(t){let types=t.machines.filter(m=>m.ready<=g.q).map(m=>m.type);if(!types.length)return null;let products=['P1','P2','P3','P4','P5'].filter(p=>hasProduct(t,p));let rates=[],cms=[];for(const type of types){for(const p of products){let rate=MACH[type].rates[p]||0;if(rate>0){rates.push(rate);cms.push(rate*(PROD[p].price-(rawPrice(p)+MACH[type].conv)));}}}let avgCm=cms.reduce((a,b)=>a+b,0)/Math.max(1,rates.reduce((a,b)=>a+b,0));let fixed=salary(t)+expectedCosts(t).admin+expectedCosts(t).electric;if(avgCm<=0)return null;return Math.max(1,Math.round(fixed/avgCm));}

function phasebar(){let phases=g.stage==='setup'?['0 · Machine Investment','0 · Bidding']:g.stage==='bid'?['Review','Bidding']:['1 · Delivery','2 · Finance','3 · Production','4 · Develop'];return `<div class="phasebar"><span class="text-muted">${g.stage==='setup'?'ROUND 0':g.stage==='bid'?'BIDDING':g.stage==='review'?'STEP 0':g.stage==='final'?'FINAL':`Q${g.q} · DECISIONS`}</span>${phases.map((x,i)=>`<span class="tag ${(g.stage==='play'&&g.step===i+1)||(g.stage==='setup'&&i===0)||(g.stage==='bid'&&i===1)?'active':''} ${(g.stage==='play'&&g.step>i+1)?'done':''}">${x}</span>`).join('')}<span class="grow"></span><span class="badge">${f()?.name||''}</span></div>`;}
function welcomeSide(){return `<h2>ANIMAL FEED FACTORY</h2><p>เวอร์ชันทดสอบสำหรับ 1 ผู้เล่น ใช้ดู UI / UX และทดลองระบบลงทุน ประมูล ผลิต ส่งมอบ บริหารเงินสด และ Event เศรษฐกิจแบบไตรมาสต่อไตรมาส</p><div class="box"><h3>🎮 SOLO TEST MODE</h3><label>รูปแบบการเล่น</label><div class="input" style="display:flex;align-items:center;min-height:38px;background:#0b2745">1 บริษัท · 1 ผู้เล่น</div><label>ความยาวเกม</label>${sel('roundsChoice',[[8,'8 รอบ'],[10,'10 รอบ'],[12,'12 รอบ']],8)}<p class="fine">Round 0: ซื้อเครื่องจักร → Bidding Q1<br>Q1 เป็นต้นไป: ส่งมอบ รับ/จ่ายเงิน ผลิต พัฒนา และรับผลกระทบจาก Event เศรษฐกิจ</p>${button('▶ START SOLO TEST','new','success full')}</div><div class="box"><h3>🏗️ MACHINE SIZE GUIDE</h3>${Object.entries(MACH).map(([k,m])=>`<div class="statline"><span>${k} · ${m.slots} Slot</span><b>${M(m.cost)}</b></div>`).join('')}<p class="text-muted">พื้นที่รวม 4 Slots · เครื่อง L ใช้คู่ 1–2 หรือ 3–4 เท่านั้น · ขายเครื่อง S/M แล้วจะเลื่อนไปช่องเลขต่ำกว่าที่ว่าง</p></div><div class="box"><h3>🌐 Economic Events</h3><p class="fine">ระบบสุ่ม 20 เหตุการณ์หลังจบ Bidding ในแต่ละรอบ โดย “ไม่มีเหตุการณ์” มีโอกาส 1 ใน 3 และเหตุการณ์รุนแรงจะเกิดยากกว่า</p></div>`;}
function setupSide(){let t=f(),filled=slots(t).filter(Boolean).length;return `<h2>🏗️ ROUND 0 — INVESTMENT</h2><p>เลือกซื้อเครื่องจักรเข้าโรงงาน เลือกเครื่อง S/M/L แล้วเครื่องจะเติมลง Slots ให้โดยอัตโนมัติ</p><div class="box"><div class="statline"><span>พื้นที่ใช้ไป</span><b>${filled}/4 Slots</b></div><div class="statline"><span>เงินสดเริ่มต้น</span><b>25.00M</b></div>${costRow('เงินสดเหลือ',t.cash,'green')}</div><div class="catalog">${Object.entries(MACH).map(([k,m])=>`<div class="catalog-item"><img src="assets/${k}.webp"><b>${k}</b><div class="price">${M(m.cost)} · ${m.slots} slot</div>${button('＋ ซื้อ','buy:'+k,'success')}</div>`).join('')}</div><div class="box"><h3>📍 Machine Positions</h3>${t.machines.length?t.machines.map(m=>`<div class="statline"><span>#${m.id} · ${m.type}</span><b>Slots ${m.slots.join('–')}</b></div>`).join(''):'<p class="text-muted">ยังไม่มีเครื่องจักร</p>'}</div>${button('ยืนยันเครื่องจักร → บริษัทถัดไป / Bidding','setupDone','success full')}<p class="fine">ต้องมีเครื่องจักรอย่างน้อย 1 เครื่อง • ยังไม่มีการผลิตและค่าใช้จ่ายดำเนินงานใน Round 0</p>`;}
function bidsSide(){let t=f(),count=g.bids[t.id]?.length;return `<h2>🤝 BIDDING — Q${g.q}</h2><p>แต่ละบริษัทเลือกได้สูงสุด 3 ลูกค้า ระบบจะเก็บผลไว้จนทุกทีมส่งครบ แล้วจึงประกาศผู้ชนะพร้อมกัน</p><div class="box"><h3>MARKET READINESS</h3><div class="statline"><span>Credibility</span><b>${t.cred}/100</b></div><div class="statline"><span>เครื่องจักร</span><b>${t.machines.map(m=>m.type).join(', ')||'—'}</b></div><div class="statline"><span>สินค้าคงคลัง</span><b>${invQty(t)} t</b></div></div>${button('ดูรายการประมูลทั้งหมด','view:market','alt full')}<p class="warning">จะสุ่ม Economic Event หลังทุกบริษัทปิด Bid แล้ว และเปิดเผยก่อนเริ่มตัดสินใจในรอบนั้น</p><p class="warning">เลือก Bid ที่หน้าตลาด (MARKET) จากนั้นกดส่ง Bid ในหน้า Market • ไม่ต้อง Bid ก็ได้</p>`;}
function productionDetail(t,m){if(!m)return '<p class="text-muted">เลือกเครื่องจักรจากภาพโรงงานหรือรายการด้านล่าง</p>';if(m.ready>g.q)return '<div class="warning">เครื่อง #'+m.id+' กำลังติดตั้ง จะผลิตได้ตั้งแต่ Q'+m.ready+'</div>';let d=getLine(t,m),calc=calcLine(t,m,d),allowed=Object.keys(MACH[m.type].rates).filter(p=>hasProduct(t,p)),pOptions=[['','— เลือกสินค้า —'],...allowed.map(p=>[p,p+' · '+MACH[m.type].rates[p]+' ตัน/Block'])];let show=!!d.p&&d.q>0&&allowed.some(p=>p!==d.p),remaining=allowed.filter(p=>p!==d.p);return `<div class="box"><h3>🏭 MACHINE #${m.id} — ${m.type}</h3><div class="statline"><span>Installed Slots</span><b>${m.slots.join('–')}</b></div><div class="statline"><span>Production Blocks</span><b>${calc.capacity} (ใช้ ${calc.used})</b></div>${t.projects.some(p=>p.kind==='people')||t.developed?`<div class="text-muted">People Development: ${t.developed?'Completed — 5 Blocks':'In Progress — ยังมี 4 Blocks'}</div>`:''}${m.broken?'<div class="warning">Breakdown: ลด 2 Blocks จนกว่าจะซ่อม</div>':''}<label>1. เลือกสินค้าแรก</label>${sel('p'+m.id,pOptions,d.p)}<label>จำนวนที่ต้องการผลิต (ตัน)</label>${num('qty'+m.id,d.q,0,10000,10)}<div class="text-muted" style="margin-top:4px">${calc.ba} Block${calc.ba!==1?'s':''} แม้ผลิตไม่เต็ม Block ก็ใช้เวลาหนึ่ง Block เต็ม</div>${show?`<hr class="sep"><label style="display:flex;gap:7px"><input type="checkbox" id="change${m.id}" ${d.change?'checked':''}> เปลี่ยนสินค้า (เสีย 1 Block)</label>${d.change?`<label>2. สินค้าที่สอง</label>${sel('p2'+m.id,[['','— เลือกสินค้า —'],...remaining.map(p=>[p,p+' · '+MACH[m.type].rates[p]+' t/Block'])],d.p2)}<label>จำนวนสินค้า 2 (ตัน)</label>${num('qty2'+m.id,d.q2,0,10000,10)}`:''}`:''}<div class="pillbar" style="margin:10px 0">${Array.from({length:Math.max(0,calc.capacity)},(_,i)=>`<span style="background:${i<calc.ba?'#1a5d99':i<calc.ba+calc.sw?'#765111':i<calc.used?'#145f4b':'#11314c'}">${i<calc.ba?d.p:i<calc.ba+calc.sw?'CHANGE':i<calc.used?d.p2:'FREE'}</span>`).join('')}</div>${calc.err.length?`<div class="error">${calc.err.join(' · ')}</div>`:''}<div class="statline"><span>Raw Materials</span><b>${THB(calc.raw)}</b></div><div class="statline"><span>Conversion Cost</span><b>${THB(calc.conversion)}</b></div><div class="statline"><span>Automation Electricity — Q+1</span><b>${THB(calc.energy)}</b></div><div class="statline"><span>จ่ายทันที</span><b class="gold">${THB(calc.immediate)}</b></div><div class="buttons">${button('บันทึกแผนเครื่อง #'+m.id,'saveLine:'+m.id,'success full')}</div></div>`;}
function playingSide(){const t=f(),step=g.step;let base=`<h2>Q${g.q} — ${t.name}</h2><p class="text-muted">Step ${step}/4 • ${['','Deliver Orders','Collect & Finance','Invest & Produce','Manage & Develop'][step]}</p>`;
 if(step===1){const valid=t.contracts.filter(c=>!c.delivered&&invQty(t,c.p,true)>=c.qty);return base+`<div class="box"><h3>🚚 Deliver Orders</h3>${valid.map(c=>`<div class="statline"><span>${c.client} ${c.p} · ${c.qty}t</span>${button('ส่งมอบ','deliver:'+c.id,'success')}</div>`).join('')||'ไม่มีสินค้าพร้อมส่งครบสัญญา'}</div>${button('ดำเนินการด้านการเงิน →','deliveryNext','full')}`;}
 if(step===2){let x=t.financeDone?{incoming:0,due:0}:queue(t);return base+`<div class="box"><h3>💵 Financial Settlement</h3>${costRow('เก็บเงินจากลูกค้า',x.incoming,'green')}${costRow('บิลจากรอบก่อน',x.due,'red')}${costRow('เงินสดปัจจุบัน',t.cash,'gold')}<label>กู้เพิ่ม (ล้านบาท)</label>${num('loan',0,0,10,.5)}<label>ชำระคืนเงินต้น (ล้านบาท)</label>${num('repay',0,0,10,.5)}<p class="text-muted">วงเงินเหลือ ${M(10000000-t.debt)} · ดอกเบี้ยรอบนี้ ${(currentInterest()*100).toFixed(1)}% ต่อไตรมาส จ่าย Q+1</p>${button(g.q===g.rounds?'ชำระและปิดรอบสุดท้าย':'ยืนยันการเงิน → Step 3','financeNext','success full')}</div>`;}
 if(step===3){let selected=t.machines.find(m=>m.id===g.selected)||t.machines.find(m=>m.ready<=g.q),c=calcProduction(t);return base+`<div class="box"><h3>⚙️ Machine Investment</h3><p>ซื้อแล้วเข้า Slots ทันที แต่เริ่มผลิตได้ Q${g.q+1}</p><div class="grid2">${Object.entries(MACH).map(([k,m])=>button('＋ '+k+' '+M(m.cost),'buy:'+k,'alt')).join('')}</div>${t.machines.length?`<label>เครื่องที่ต้องการขาย</label>${sel('sellMachine',[['','— เลือกเครื่อง —'],...t.machines.map(m=>[m.id,'#'+m.id+' '+m.type+' · Slots '+m.slots.join('–')])],'')}${button('ขายเครื่อง (รับ 55% ของราคาซื้อ)','sell','danger full')}`:''}</div><div class="box"><h3>📦 Production Preview</h3><div class="statline"><span>ใช้ Operators</span><b>${c.workers}/${t.staff}</b></div>${costRow('วัตถุดิบ',c.raw)}${costRow('ต้นทุนแปรรูป',c.conversion)}${costRow('รวมจ่ายทันที',c.immediate,'gold')}${costRow('ค่าไฟ Automation จ่าย Q+1',c.energy)}${costRow('ค่าไฟคงที่ จ่าย Q+1',expectedCosts(t).electric)}${costRow('เงินเดือนจ่ายสิ้น Q',salary(t))}${costRow('เงินสดหลังผลิต',t.cash-c.immediate,c.immediate>t.cash?'red':'green')}<div class="fine">เงินสดหลังผลิตก่อนหักเงินเดือนและค่าใช้จ่ายโครงการ Step 4</div>${c.issues.length?`<div class="error">${c.issues.join('<br>')}</div>`:''}</div>${productionDetail(t,selected)}${button('ยืนยันการผลิต → Step 4','productionNext','success full')}<div class="buttons">${button('กลับไปกู้เงินเพิ่ม','backFinance','alt full')}</div>`;}
 if(step===4){let has=t.projects.some(p=>p.kind==='people'),training=t.projects.some(p=>p.kind==='training');return base+`<div class="box"><h3>👷 People & Workforce</h3><div class="grid2"><div><label>จ้างเพิ่ม → Q+1</label>${sel('hire',[[0,'0'],[1,'1'],[2,'2'],[3,'3']],0)}</div><div><label>เลิกจ้าง → Q+1</label>${sel('fire',[[0,'0'],[1,'1'],[2,'2'],[3,'3']],0)}</div></div>${!has&&!t.developed?`<label><input type="checkbox" id="developPeople"> People Development — 1.10M / 2 รอบ</label>`:`<div class="badge">People Development: ${t.developed?'Completed ✓':'In Progress — +1 Block เมื่อครบ 2 รอบ'}</div>`}${!training&&!t.trained?`<label><input type="checkbox" id="trainAuto"> Automation Training — 180k / 1 รอบ</label>`:t.trained?'<div class="badge">Automation Training ✓</div>':''}</div><div class="box"><h3>⚗️ R&D / Marketing</h3><label>Product Research</label>${sel('research',[['','ไม่ทำ'],...['P4','P5'].filter(p=>!t.unlocked[p]&&!t.projects.some(x=>x.kind===p)).map(p=>[p,p==='P4'?'P4 — 850k / 1 รอบ':'P5 — 1.60M / 2 รอบ'])],'')}<label>Marketing</label>${sel('marketing',[[0,'ไม่ลงทุน'],[100000,'100k'],[240000,'240k'],[400000,'400k']],0)}</div><div class="box"><h3>🔧 Maintenance / Repair / Automation</h3>${t.machines.filter(m=>m.ready<=g.q).map(m=>`<label>Machine #${m.id} — ${m.type} ${m.broken?'⚠️':''}</label>${sel('action'+m.id,[['none','ไม่ทำ'],['pm','Maintenance '+M(MACH[m.type].pm)],...(m.broken?[['repair','Repair '+M(MACH[m.type].repair)]]:[]),...(MACH[m.type].auto&&!m.auto?[['auto','Automation '+M(MACH[m.type].auto)]]:[])],'none')}`).join('')}<p class="fine">ซ่อมและ Maintenance มีผล Q+1 · Automation ใช้ 2 รอบ</p></div>${button('✔ SUBMIT QUARTER '+g.q,'developmentNext','success full')}${button('กลับไปกู้เงิน','backFinance','alt full')}`;}
 return base;
}
function side(){if(g.stage==='welcome')return welcomeSide();if(g.stage==='setup')return setupSide();if(g.stage==='bid')return bidsSide();if(g.stage==='review'){let t=f(),h=t.history.at(-1);return `<h2>📊 STEP 0 — BUSINESS REVIEW</h2><p>ผลประกอบการ Q${g.q-1} แสดงแล้ว และจะเปิด Bid สำหรับ Q${g.q} หลังยืนยัน</p>${h?`<div class="box">${costRow('Quarterly Revenue',h.sales,'green')}${costRow('Net Profit',h.net,h.net>=0?'green':'red')}${costRow('Event & Costs',h.opex)}<div class="statline"><span>Balance Check</span><b>${THB(h.check)}</b></div></div>`:''}${button('🌐 ดูเหตุการณ์เศรษฐกิจ','view:events','alt full')}${button('ดูงบเต็มและ Event Cost','view:finance','alt full')}${button('ไป Bidding Q'+g.q,'goBid','success full')}`;}
 if(g.stage==='final-round')return `<h2>🏁 FINAL SETTLEMENT</h2><p>ไตรมาส Q${g.q} คือรอบสุดท้าย ไม่มี Bidding การผลิต หรือการลงทุนใหม่</p>${button('เริ่ม Final Settlement','finalGo','success full')}<p class="text-muted">ส่งของในคลังที่ผลิตจากรอบก่อน และรับชำระหรือจ่ายบิลตามกำหนด</p>`;
 if(g.stage==='final'){let rankings=g.teams.map(t=>({name:t.name,equity:28000000+t.retained,rep:t.cred})).sort((a,b)=>b.equity-a.equity);return `<h2>🏆 FINAL RESULTS</h2>${rankings.map((x,i)=>`<div class="box"><b>${i+1}. ${x.name}</b><div class="statline"><span>Equity</span><b class="gold">${M(x.equity)}</b></div><div class="text-muted">Credibility ${x.rep}/100</div></div>`).join('')}${button('เล่นเกมใหม่','reset','success full')}`;}
 return playingSide();}
function popTable(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${rows.map(row=>'<tr>'+row.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`;}
function eventsPop(t){let e=eventNow();return `<h2>🌐 ECONOMIC EVENT — MARKET CONDITIONS</h2>${g.activeEvent&&g.activeEvent.q===g.q?`<div class="box"><h3>${e.name}</h3><p>${e.effect}</p><p class="text-muted">เกิดขึ้นหลังการประมูลสำหรับ Q${g.q} และใช้กับทุกบริษัท</p></div>`:'<div class="warning">ยังไม่มีการสุ่ม Event สำหรับรอบนี้</div>'}<h3>Market Event History</h3>${popTable(['Round','Event'],(g.eventHistory||[]).map(x=>['Q'+x.q,x.name]))}<h3>20 Patterns · Weights = 300</h3>${popTable(['ID','Severity','Event','Weight','Probability'],EVENTS.map(x=>[x.id,x.severity,x.name,x.weight,(x.weight/3).toFixed(2)+'%']))}<p class="fine">อัตราส่วนมาจากการออกแบบเกม ไม่ใช่ความถี่ที่วัดได้จากโลกจริง; 1 ใน 3 ไม่มีเหตุการณ์</p>`;}
function dashboardPop(t){let h=t.history.at(-1),c=expectedCosts(t);return `<h2>🏠 Business Overview</h2><div class="grid2"><div class="box">💵 Cash <h2 class="green">${M(t.cash)}</h2><span class="fine">เงินสดในมือ</span></div><div class="box">🏦 Debt<h2 class="gold">${M(t.debt)}</h2><span class="fine">ดอกเบี้ย Q นี้ ${THB(c.interest)}</span></div><div class="box">🏭 Machinery <h2>${t.machines.length}</h2><span class="fine">ใช้พื้นที่ ${slots(t).filter(Boolean).length}/4 slots</span></div><div class="box">👷 Employees<h2>${t.staff}</h2><span class="fine">เงินเดือน ${THB(salary(t))}/Q</span></div><div class="box">📦 Inventory<h2>${invQty(t)}t</h2><span class="fine">มูลค่าตามต้นทุน ${M(invValue(t))}</span></div><div class="box">⭐ Credibility<h2>${t.cred}/100</h2><span class="fine">ใช้ประเมินสิทธิ Bid</span></div><div class="box">⚖️ Break-even<h2>${breakEvenEstimate(t)?B(breakEvenEstimate(t))+'t':'—'}</h2><span class="fine">ประเมินต่อไตรมาส</span></div></div>${h?`<div class="box"><h3>Last Quarter Q${h.q}</h3>${costRow('Revenue',h.sales)}${costRow('COGS',h.cogs)}${costRow('Net Profit',h.net,h.net>=0?'green':'red')}${costRow('Assets − Liabilities − Equity',h.check,h.check===0?'green':'red')}</div>`:''}`;}
function inventoryPop(t){const lots=t.inventory.filter(z=>z.qty>0);return `<h2>📦 Finished Goods Inventory</h2><p class="text-muted">สินค้า Q นี้ส่งมอบได้เร็วที่สุด Q ถัดไป • ค่าดูแลคลังคิดขั้นบันไดจากปริมาณรวมปลายรอบ</p>${popTable(['Product','ผลิตใน Q','Qty (t)','Cost / t','Total Cost'],lots.map(x=>[x.p,'Q'+x.q,B(x.qty),THB(x.unit),THB(x.qty*x.unit)]))}${lots.length?'':'<p class="warning">ยังไม่มีสินค้าคงคลัง</p>'}<div class="box">${costRow('Inventory at Cost',invValue(t),'green')}${costRow('Warehouse Fee Estimate',expectedCosts(t).warehouse,'gold')}</div>`;}
function salesPop(t){return `<h2>📈 Sales & Contracts</h2><p class="text-muted">ส่งมอบครบตามสัญญาเท่านั้น ลูกค้าที่มีสัญญาค้างส่งจะไม่เปิด RFP ของสินค้าเดิม</p>${popTable(['Contract','สินค้า','Qty','Deliver by','Status'],t.contracts.map(c=>[c.client,c.p,B(c.qty)+'t','Q'+c.due,c.delivered?'<span class="green">DELIVERED</span>':'<span class="gold">PENDING</span>']))}<div class="box">${costRow('A/R Outstanding',t.ar)}<div class="text-muted">เงินรับตามกำหนด: ${t.receipts.map(x=>'Q'+x.due+': '+M(x.amount)).join(' · ')||'—'}</div></div>`;}
function financePop(t){let h=t.history.at(-1),events=h?.details||[];return `<h2>💰 FINANCIAL REPORT & EVENT COST BREAKDOWN</h2><p class="text-muted">งบการเงินที่ปิดล่าสุด Q${h?.q||'—'} และรายการค้างรับ/ค้างจ่าย ณ ปัจจุบัน</p>${h?`<div class="grid2"><div class="box"><h3>Income Statement · Q${h.q}</h3>${costRow('Revenue',h.sales)}${costRow('COGS',h.cogs)}${costRow('Operating Expenses',h.opex)}${costRow('Depreciation',h.dep)}${costRow('Interest',h.interest)}${costRow('Other Gain/(Loss)',h.other)}${costRow('Tax',h.tax)}${costRow('NET PROFIT',h.net,h.net>=0?'green':'red')}</div><div class="box"><h3>Balance Sheet · Q${h.q}</h3>${costRow('Cash',h.cash)}${costRow('Accounts Receivable',h.ar)}${costRow('Finished Inventory',h.inv)}${costRow('Property & Equipment',h.ppe)}<hr class="sep">${costRow('TOTAL ASSETS',h.assets,'green')}${costRow('LIABILITIES',h.liab)}${costRow('EQUITY',h.equity)}${costRow('BALANCE CHECK',h.check,h.check===0?'green':'red')}</div></div><h3>🔍 Event & Cost Breakdown</h3>${popTable(['Type','Business Event / Cost','Amount'],events.map(e=>[e.type,e.label,THB(e.amount)]))}`:'<div class="warning">ยังไม่มีงบปิดรอบ เริ่มเห็นงบหลัง Submit Q1</div>'}<div class="box"><h3>Business Snapshot</h3>${breakEvenEstimate(t)?costRow('Break-even Estimate',breakEvenEstimate(t),'gold'):'<div class=\"text-muted\">ยังคำนวณ Break-even ไม่ได้</div>'}<div class="text-muted">คำนวณจาก Fixed Cost ปัจจุบันและ Contribution Margin โดยเฉลี่ยของสินค้าที่เครื่องพร้อมผลิต</div></div><h3 style="margin-top:12px">Current Loan & Payables</h3><div class="box">${costRow('Loan Principal',t.debt)}${costRow('Accounts Payable',t.ap)}${costRow('Accounts Receivable',t.ar)}<div class="text-muted">บิลรอจ่าย: ${t.bills.map(b=>'Q'+b.due+' '+b.label+' '+M(b.amount)).join(' • ')||'—'}</div></div>`;}
function marketPop(t){let active=g.stage==='bid',available=openRfps().filter(r=>canSee(t,r));const table=popTable(['Select','Customer','Product','Volume','Payment','Price Bid'],available.map(r=>{let eligible=hasProduct(t,r.p)&&t.cred>=r.min;return[active?`<input type="checkbox" data-rfp="${r.id}" ${eligible?'':'disabled'}>`:'—',r.client+(eligible?'':' 🔒'),r.p,B(qty(r))+'t',r.pay==='now'?'ทันที':r.pay==='next'?'Q+1':'Q+1 / Q+2',active&&eligible?sel('disc'+r.id,[[0,THB(PROD[r.p].price)+'/t'],[3,'ลด 3%'],[6,'ลด 6%'],[9,'ลด 9%']],0):THB(PROD[r.p].price)]}));return `<h2>👥 CUSTOMER MARKET — Q${g.q}</h2><p class="text-muted">ทุก Order ใช้ลำดับที่กำหนดไว้ล่วงหน้า • จัดส่งครบ → Order ต่อไป • ไม่มีคน Bid 2 รอบ → เลื่อนไป Order Version ถัดไป</p>${active?`<div class="warning">BIDDING PHASE — เลือกไม่เกิน 3 ลูกค้า หรือจะข้ามก็ได้ เมื่อ Submit แล้วระบบจะสุ่ม Economic Event และเริ่ม Q${g.q}</div>`:''}${table}<div class="box"><h3>🔒 Locked Customer–Product</h3>${g.market.filter(r=>r.intro<=g.q&&r.state==='locked').map(r=>`<span class="badge">${r.client} ${r.p}</span>`).join(' ')||'<p class="text-muted">ยังไม่มีรายการติดสัญญา</p>'}</div>${active?button('✔ SUBMIT BIDS / START QUARTER','submitBids','success full'):'<p class="text-muted">จะเปิดให้ Bidding ใน Step 0 หลังปิดงบแต่ละรอบ (ยกเว้นรอบสุดท้าย)</p>'}`;}
function productsPop(t){return `<h2>🐄 PRODUCTS CATALOG</h2>${popTable(['Product','ขาย/ตัน','วัตถุดิบ/ตัน','Unlock'],Object.entries(PROD).map(([p,x])=>[p,THB(x.price),THB(x.raw),hasProduct(t,p)?'<span class="green">READY</span>':'<span class="gold">LOCKED</span>']))}<div class="box"><h3>Capacity per Block</h3>${popTable(['Machine','P1','P2','P3','P4','P5'],Object.entries(MACH).map(([k,m])=>[k,...Object.keys(PROD).map(p=>m.rates[p]?m.rates[p]+'t':'—')]))}</div>`;}
function rdPop(t){return `<h2>⚗️ PEOPLE, AUTOMATION & R&D</h2><p class="text-muted">ทุกโครงการแสดงเมื่อเริ่มจริง • ระยะเวลาพัฒนาคน 2 รอบ / Automation 2 รอบ + Training 1 รอบ</p><div class="box"><h3>Active Projects</h3>${t.projects.length?t.projects.map(p=>`<div class="statline"><span>${p.kind} ${p.machine?'#'+p.machine:''}</span><b>${p.done?'Completed ✓':'Ready Q'+p.ready}</b></div>`).join(''):'<p class="text-muted">ยังไม่มีการเริ่มโครงการพัฒนา</p>'}</div><p>การลงทุนด้านบุคลากร, Automation, Research และ Maintenance ทำใน Step 4 ของแต่ละไตรมาส</p>`;}
function settingsPop(t){return `<h2>⚙️ GAME SETTINGS & RULES</h2><div class="box"><h3>Fundamental Rules</h3><p>Round 0: ลงทุนซื้อเครื่องจักรและยื่น Bidding สำหรับ Q1 เท่านั้น</p><p>Q1 เป็นต้นไป: ส่งมอบสินค้าที่ผลิตจากรอบก่อน รับ/จ่ายเงิน กู้เงิน ผลิต และพัฒนาธุรกิจ</p><p>Production Blocks: 4 ปกติ, 5 เมื่อ People Development สำเร็จ; เปลี่ยนผลิตภัณฑ์เสีย 1 Block</p><p>เครื่องจักร Breakdown ลด 2 Blocks จนกว่าจะซ่อมสำเร็จในรอบถัดไป</p><p>ค่าไฟคงที่และค่าไฟ Automation บันทึกในรอบที่เกิดและชำระรอบถัดไป</p><p>สุ่ม Economic Event 1 รายการต่อรอบ หลังปิดประมูลเท่านั้น • 20 Patterns รวม 300 น้ำหนัก • No Event = 100/300</p><p>Large ใช้ Slots 1–2 หรือ 3–4 เท่านั้น • เมื่อขายเครื่อง S/M ที่เหลือจะเลื่อนไปช่องเลขต่ำกว่า</p></div><div class="box"><h3>💾 SAVE / RESTORE</h3><div class="buttons">${button('Save ในเครื่อง','saveGame','success')}${button('Restore','restoreGame','alt')}${button('Export JSON','exportGame','alt')}</div><label>Import Save JSON</label><input id="importSave" type="file" accept="application/json" class="input"><p class="fine">การ Save เก็บในเบราว์เซอร์นี้ หากต้องการย้ายอุปกรณ์ให้ใช้ Export JSON</p></div><p class="warning">Playable Single-Player Test: โค้ดเป็น Vanilla HTML/CSS/JS ไม่มี Build Step เหมาะสำหรับอัปโหลดขึ้น GitHub Pages และเปิดบน Safari iOS, Chrome Android และ Chrome/Edge บน Desktop</p>${g.stage==='final'?button('เล่นเกมใหม่','reset','success'):''}`;}
function overlay(t){if(g.view==='factory'||g.view==='process')return '';const content=g.view==='events'?eventsPop(t):g.view==='dashboard'?dashboardPop(t):g.view==='inventory'?inventoryPop(t):g.view==='sales'?salesPop(t):g.view==='finance'?financePop(t):g.view==='rd'?rdPop(t):g.view==='market'?marketPop(t):g.view==='settings'?settingsPop(t):productsPop(t);let white=(g.stage==='bid'||g.stage==='review')&&(g.view==='market'||g.view==='finance'||g.view==='dashboard');return `<section class="popup-screen ${white?'white':''}"><div class="row"><span class="badge">${g.stage==='setup'?'ROUND 0':g.stage==='final'?'FINAL':g.stage==='review'?'STEP 0':g.stage==='bid'?'BIDDING':'Q'+g.q}</span><button class="btn alt" data-view="factory">✕ กลับโรงงาน</button></div>${content}</section>`;}
function view(){if(g.stage==='welcome'){let preview={machines:[],cash:25000000,history:[],inventory:[],debt:0,ar:0,ap:0,facility:3000000,pnl:null};return `<div class="viewport"><div class="artboard factory"><div class="scene-top">WELCOME TO YOUR FACTORY — PLACE MACHINES IN 4 SLOTS</div><div class="floor-footnote">S = 1 SLOT · M = 1 SLOT · L = 2 SLOTS</div></div></div>`;}
let t=f(),art=g.view==='process'?'process':'factory',scene=g.view==='process'?processMarkup(t):machineMarkup(t);return `<div class="viewport"><div class="artboard ${art}"><div class="scene-top">${art==='process'?'🔀 LIVE BUSINESS PROCESS & MONEY FLOW':'🏭 '+t.name+' — FACTORY LAYOUT · '+slots(t).filter(Boolean).length+'/4 SLOTS'}</div>${scene}${art==='factory'?`<div class="floor-footnote">SMALL 1 SLOT · MEDIUM 1 SLOT · LARGE 2 SLOTS</div><div class="floor-msg">${g.stage==='setup'?'ซื้อเครื่องจักรจากรายการด้านขวาแล้วเครื่องจะวางลง Slot ทันที':g.stage==='play'&&g.step===3?'คลิกเครื่องจักรเพื่อวางแผนผลิต → ใช้เงินจริงตามต้นทุนที่แสดง':'คลิก FACTORY / PROCESS / FINANCE เพื่อดูรายละเอียด'}</div>`:''}${overlay(t)}</div></div>`;}
function paint(){mount.innerHTML=header()+phasebar()+economicBanner()+(g.msg?`<div class="${g.msg.includes('ขาด')||g.msg.includes('ผิด')||g.msg.includes('ไม่ได้')||g.msg.includes('เกิน')?'error':'successmsg'}">${g.msg}</div>`:'')+`<div class="main">${view()}<aside class="side">${side()}</aside></div>`+navbar();setTimeout(animateResearch,0);}
function handle(action){if(action==='new')return begin();if(action==='saveGame'){try{localStorage.setItem('animal_feed_factory_save_v1',JSON.stringify(g));return notice('บันทึกเกมบนเบราว์เซอร์นี้แล้ว');}catch(err){return notice('เบราว์เซอร์ไม่อนุญาต Save: กรุณาใช้ Export JSON');}}if(action==='restoreGame'){try{let d=JSON.parse(localStorage.getItem('animal_feed_factory_save_v1')||'null');if(!d||!Array.isArray(d.teams))return notice('ยังไม่มี Save ที่ใช้ได้');g=d;return paint();}catch(e){return notice('ไม่สามารถอ่าน Save ได้');}}if(action==='exportGame'){let blob=new Blob([JSON.stringify(g,null,2)],{type:'application/json'}),link=document.createElement('a'),url=URL.createObjectURL(blob);link.href=url;link.download='animal-feed-factory-save-Q'+g.q+'.json';link.click();URL.revokeObjectURL(url);return;}if(action==='reset'){g={stage:'welcome',view:'factory',q:0,rounds:8,teams:[],idx:0,step:0,msg:'',selected:null,seq:0,bids:{},bidDraft:{},market:[],activeEvent:null,eventHistory:[],rateAdd:{}};return paint();}if(action==='setupDone')return completeSetup();if(action==='submitBids')return bidMarket();if(action==='goBid')return afterReview();if(action==='finalGo')return startFinalRound();if(action==='deliveryNext'){g.step=2;return paint();}if(action==='financeNext')return settle();if(action==='productionNext')return completeProduction();if(action==='developmentNext')return develop();if(action==='backFinance'){g.step=2;g.view='finance';return paint();}if(action==='sell'){let id=+(qs('#sellMachine')?.value||0);return id?dispose(id):notice('โปรดเลือกเครื่องที่ต้องการขาย');}if(action.startsWith('buy:'))return purchase(action.slice(4));if(action.startsWith('deliver:'))return deliver(action.slice(8));if(action.startsWith('saveLine:'))return saveLine(+action.slice(9));if(action.startsWith('machine:')){g.selected=+action.slice(8);g.view='factory';return paint();}if(action.startsWith('view:'))return changeView(action.slice(5));}
mount.addEventListener('change',e=>{if(e.target.id==='importSave'&&e.target.files?.[0]){let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!data||!Array.isArray(data.teams)||!Array.isArray(data.market))throw Error('invalid');g=data;paint();}catch(err){notice('ไฟล์ Save ไม่ถูกต้อง');}};reader.readAsText(e.target.files[0]);return;}});
mount.addEventListener('click',e=>{let action=e.target.closest('[data-act]')?.dataset.act||e.target.closest('[data-click]')?.dataset.click;if(action){e.preventDefault();handle(action);return;}let view=e.target.closest('[data-view]')?.dataset.view;if(view){e.preventDefault();changeView(view);}});
// Preserve visible form values for post-change selection before redrawing,
// but do not change the business state until the player clicks Save.
let researchTimer=null,researchFrame=0;function animateResearch(){clearInterval(researchTimer);researchTimer=setInterval(()=>{researchFrame=(researchFrame+1)%8;mount.querySelectorAll('.research-sprite').forEach(el=>{let c=researchFrame%4,r=Math.floor(researchFrame/4);el.style.backgroundPosition=`-${c*72}px -${r*108}px`;});},180);}mount.addEventListener('change',e=>{if(g.stage==='play'&&g.step===3){let id=e.target.id.match(/^(p2|qty2|change|qty|p)(\d+)$/);if(id){let num=+id[2],t=f(),d={...getLine(t,{id:num})};if(id[1]==='p'){d.p=e.target.value;d.q=0;d.change=false;d.p2='';d.q2=0;}else if(id[1]==='qty')d.q=Math.max(0,Math.floor(+e.target.value||0));else if(id[1]==='change'){d.change=e.target.checked;if(!d.change){d.p2='';d.q2=0;}}else if(id[1]==='p2')d.p2=e.target.value;else if(id[1]==='qty2')d.q2=Math.max(0,Math.floor(+e.target.value||0));t.planning[num]=d;paint();}}});
paint();animateResearch();
})();
</script></body></html>
